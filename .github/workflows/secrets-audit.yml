name: secrets-audit

# Fail-closed check that no plaintext secret can reach this repository.
#
# Runs with NO age key on purpose. Everything it asserts is key-independent:
# that no plaintext env file is tracked or staged, that .gitignore still denies
# them, that nothing was force-added past those rules, and that every file in
# env/enc/ is genuinely sops-encrypted with at least two recipients. Handing CI
# a decryption key merely to lint would defeat the audit it is performing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  env-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # env-check inspects tracked history, not just the worktree.
          fetch-depth: 0
          persist-credentials: false

      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/secrets-audit.yml

      - name: Install checksum-pinned just
        env:
          JUST_VERSION: '1.51.0'
          JUST_SHA256: c8f085ca3e885723c341d06243fc291b5abfdc8bbe3b2c076b117de490387b59
        run: |
          set -euo pipefail
          archive=/tmp/just.tar.gz
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors \
            --location --fail --silent --show-error -o "$archive" \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$JUST_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version

      - name: Install immutable ores-sops bootstrap
        env:
          ORES_SOPS_REV: 6e08ece03913da6464f4ad1814f3e404f578570a
          ORES_SOPS_BLOB: e746935e85b5c9ff2869f63bb7191dfecf46328c
        run: |
          set -euo pipefail
          script=/tmp/ores-sops
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors \
            --location --fail --silent --show-error -o "$script" \
            "https://raw.githubusercontent.com/ORESoftware/ores-sops/${ORES_SOPS_REV}/ores-sops"
          actual_blob="$(git hash-object "$script")"
          test "$actual_blob" = "$ORES_SOPS_BLOB"
          sudo install -m 0755 "$script" /usr/local/bin/ores-sops
          ores-sops --version

      - name: Audit encrypted environment contract
        run: just env-check
